<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            background: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #285fd6;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #285fd6;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px;
            box-shadow: 0 6px 15px rgba(40, 95, 214, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #1e4bb8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 95, 214, 0.4);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(40, 95, 214, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cable ya exitente</h1>
        <p>Opciones a elegir</p>

        <a class="btn" href="http://192.168.101.17:15000/?accion=getelements">
            Ver listado de cables
        </a>

        <a class="btn" href="http://192.168.101.17:15000/?accion=addelement">
            Volver a añadir
        </a>
    </div>

</body>
</html>
