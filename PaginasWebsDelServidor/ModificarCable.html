<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Añadir Cable</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e0f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 10px;
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: #b0bec5;
            color: #004d40;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 1000;
        }

        .back-button:hover {
            background: #90a4ae;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            margin: 35px;
        }

        h2 {
            text-align: center;
            color: #00796b;
            margin-bottom: 25px;
        }

        form {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            width: 100%;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #004d40;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #b2dfdb;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: #80cbc4;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: #00796b;
            box-shadow: 0 0 5px rgba(0,121,107,0.3);
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #00796b;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background: #004d40;
        }

        select {
            background: #f0f0f0;
        }
    </style>
</head>
<body>

<a href="http://localhost:8080/?accion=star">
    <button class="back-button">← Volver</button>
</a>

<div class="form-container">
    <form action="http://localhost:8080/" method="get">
        <h2>Modificar datos del Cable</h2>

        <input type="hidden" name="accion" value="editelement">

        <label for="id">ID</label>
        <input type="number" id="id" name="id" value="${id}" readonly required>

        <label for="cantidad">Cantidad de Conductores</label>
        <input type="number" id="cantidad" name="cantidadDeConductores" value="${cantidadDeConductores}" required>

        <label for="marca">Marca del Cable</label>
        <input type="text" id="marca" name="marcaDelCable" value="${marcaDelCable}" required>

        <label for="metros">Metros</label>
        <input type="number" id="metros" name="metros" value="${metros}" required>

        <label for="seccion">Sección del Cable</label>
        <input type="number" id="seccion" name="seccionDelCable" value="${seccionDelCable}" required>

        <label for="libre">Libre de Halógenos</label>
        <select id="libre" name="libreDeHalogenos" required>
            <option value="true" ${selectedLibreSi}>Sí</option>
            <option value="false" ${selectedLibreNo}>No</option>
        </select>

        <label for="fachada">Fachada o Vivienda</label>
        <select id="fachada" name="fachadaOVivienda" required>
            <option value="">Seleccione...</option>
            <option value="true" ${fachadaOViviendaSi}>Sí</option>
            <option value="false" ${fachadaOViviendaNo}>No</option>
        </select>

        <label for="fechaCompra">Fecha de Compra</label>
        <input type="date" id="fechaDeCompra" name="fechaDeCompra" value="${fechaDeCompra}" required>

        <label for="fechaDeVencimiento">Fecha de Vencimiento</label>
        <input type="date" id="fechaDeVencimiento" name="fechaDeVencimiento" value="${fechaDeVencimiento}" required>

        <input type="submit" value="Guardar">
    </form>
</div>

</body>
</html>
